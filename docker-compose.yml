services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: music
    # 5433 is taken by another local project. Bound to 127.0.0.1 so other devices on the same
    # network can't connect with the public app/app login
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d music"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
