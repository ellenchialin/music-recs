services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: music
    # 用 5434：5433 已經給 job-alert-triage，兩個專案可以同時開
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d music"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
