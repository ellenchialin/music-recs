name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI only checks code, it never writes to the repo
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # DB tests need a real Postgres, configured like docker-compose.yml. Anchored so the e2e job
    # uses the same definition
    services: &postgres
      db:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: music
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U app -d music"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  # The main flow in a real browser against the production build. Separate from `check` so a slow
  # browser download doesn't hold up the faster checks
  e2e:
    runs-on: ubuntu-latest
    services: *postgres
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps --no-shell chromium
      - run: pnpm test:e2e
      # The report holds a trace of each failed test: every step, the DOM and the network
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
