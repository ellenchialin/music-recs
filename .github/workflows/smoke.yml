name: Smoke test

# Times the main flow on the live site against per-phase budgets, with real Last.fm and iTunes behind it.
# After each production deploy (Vercel reports it as a commit status, not a GitHub deployment) and
# once a week for outside changes (Last.fm, iTunes, Neon). Not on push: that would test the old deploy
on:
  status:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    # Every commit status fires `status`; only Vercel's success on main is a production deploy
    if: >-
      github.event_name != 'status' ||
      (github.event.context == 'Vercel' && github.event.state == 'success' && contains(github.event.branches.*.name, 'main'))
    runs-on: ubuntu-latest
    # A second deploy while a run is going: test the newer one. On the job, not the workflow, so the
    # status events this job skips (Vercel's "pending", other contexts) can't cancel a running test
    concurrency:
      group: smoke
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps --no-shell chromium
      - run: pnpm test:smoke
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: smoke-report
          path: playwright-report/
          retention-days: 7
