<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Recs · Architecture</title>
  <!-- Source for docs/diagrams/architecture.png (README). Drawn with the diagram-design skill in the
       site's own theme: the tokens below mirror @theme in app/assets/css/main.css -->
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-pink: #f8527e;
      --color-ink: #131f39;
      --color-ink-soft: #29374d;
      --color-paper: #f2efe9;
      --color-paper-muted: #b7bccb;
      --color-teal: #1ec8bc;
      --color-plum: #533852;
      --font-display: "Archivo", "Noto Sans TC", system-ui, sans-serif;
      --font-sans: "Noto Sans TC", system-ui, sans-serif;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-pink);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-display);
      font-stretch: 125%;
      font-weight: 800;
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-display);
      font-stretch: 125%;
      font-weight: 800;
      letter-spacing: -0.03em;
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      margin-bottom: 1.5rem;
    }
    .scroll { overflow-x: auto; }
    svg { width: 100%; min-width: 960px; display: block; }

    svg .name { font-family: var(--font-display); font-stretch: 125%; font-weight: 700; font-size: 12px; letter-spacing: -0.02em; }
    svg .sub { font-family: var(--font-sans); font-weight: 500; font-size: 9.5px; }
    svg .tag { font-family: var(--font-display); font-stretch: 125%; font-weight: 800; font-size: 7px; letter-spacing: 0.08em; }
    svg .eyebrow-svg { font-family: var(--font-display); font-stretch: 125%; font-weight: 800; font-size: 9px; letter-spacing: 0.14em; }
    svg .legend { font-family: var(--font-sans); font-weight: 500; font-size: 10px; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture</p>
    <h1>How Music Recs works</h1>

    <div class="scroll">
    <svg viewBox="0 52 960 524" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
      <title id="architecture-title">How Music Recs works</title>
      <desc id="architecture-desc">Nuxt pages call API routes that rate-limit and validate each request. Four services: Recommendations builds the list; Reasons streams optional AI reasons from Claude Haiku; the taste agent lets Claude Haiku choose Last.fm lookups to find artists from a description; the Taste Check runs the blind test. All are backed by a Postgres cache that calls Last.fm and iTunes on a miss.</desc>
      <defs>
        <marker id="architecture-arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
          <polygon points="0 0, 10 4, 0 8" fill="#131f39"/>
        </marker>
      </defs>

      <rect y="52" width="960" height="524" fill="#f8527e"/>

      <!-- Zones -->
      <rect x="192" y="76" width="392" height="396" fill="none" stroke="#131f39" stroke-width="2" stroke-dasharray="2,5"/>
      <rect x="204" y="69" width="168" height="14" fill="#f8527e"/>
      <text x="212" y="80" class="eyebrow-svg" fill="#131f39">VERCEL · NUXT SERVER</text>

      <rect x="792" y="76" width="160" height="388" fill="none" stroke="#131f39" stroke-width="2" stroke-dasharray="2,5"/>
      <rect x="804" y="69" width="92" height="14" fill="#f8527e"/>
      <text x="812" y="80" class="eyebrow-svg" fill="#131f39">EXTERNAL</text>

      <!-- Arrows (before nodes). Main path: pages → routes → recommendations → cache -->
      <line x1="160" y1="320" x2="206" y2="320" stroke="#131f39" stroke-width="3" marker-end="url(#architecture-arrow)"/>
      <line x1="344" y1="320" x2="398" y2="320" stroke="#131f39" stroke-width="3" marker-end="url(#architecture-arrow)"/>
      <line x1="568" y1="320" x2="622" y2="320" stroke="#131f39" stroke-width="3" marker-end="url(#architecture-arrow)"/>

      <!-- Routes → Reasons, the agent and the Taste Check -->
      <path d="M 344,304 H 364 Q 372,304 372,296 V 136 Q 372,128 380,128 H 398" fill="none" stroke="#131f39" stroke-width="2" marker-end="url(#architecture-arrow)"/>
      <path d="M 372,232 Q 372,224 380,224 H 398" fill="none" stroke="#131f39" stroke-width="2" marker-end="url(#architecture-arrow)"/>
      <path d="M 344,336 H 364 Q 372,336 372,344 V 408 Q 372,416 380,416 H 398" fill="none" stroke="#131f39" stroke-width="2" marker-end="url(#architecture-arrow)"/>

      <!-- Reasons and the agent → Claude (optional). The agent's line passes under the cache line -->
      <line x1="568" y1="116" x2="806" y2="116" stroke="#131f39" stroke-width="2" stroke-dasharray="8,5" marker-end="url(#architecture-arrow)"/>
      <line x1="568" y1="212" x2="806" y2="212" stroke="#131f39" stroke-width="2" stroke-dasharray="8,5" marker-end="url(#architecture-arrow)"/>
      <rect x="664" y="206" width="16" height="12" fill="#f8527e"/>

      <!-- Reasons, the agent and the Taste Check → cache -->
      <path d="M 568,148 H 664 Q 672,148 672,156 V 286" fill="none" stroke="#131f39" stroke-width="2" marker-end="url(#architecture-arrow)"/>
      <path d="M 568,240 H 664 Q 672,240 672,248" fill="none" stroke="#131f39" stroke-width="2"/>
      <path d="M 568,416 H 664 Q 672,416 672,408 V 354" fill="none" stroke="#131f39" stroke-width="2" marker-end="url(#architecture-arrow)"/>

      <!-- Cache → Last.fm and iTunes on a miss -->
      <line x1="760" y1="312" x2="806" y2="312" stroke="#131f39" stroke-width="2" marker-end="url(#architecture-arrow)"/>
      <path d="M 760,336 H 776 Q 784,336 784,344 V 400 Q 784,408 792,408 H 806" fill="none" stroke="#131f39" stroke-width="2" marker-end="url(#architecture-arrow)"/>

      <!-- Node: Nuxt pages -->
      <rect x="32" y="288" width="128" height="64" fill="#f2efe9" stroke="#131f39" stroke-width="3"/>
      <rect x="40" y="296" width="60" height="12" fill="none" stroke="#131f39" stroke-width="1.5"/>
      <text x="70" y="305" class="tag" fill="#131f39" text-anchor="middle">BROWSER</text>
      <text x="96" y="330" class="name" fill="#131f39" text-anchor="middle">Nuxt pages</text>
      <text x="96" y="344" class="sub" fill="#29374d" text-anchor="middle">Vue 3 · Pinia</text>

      <!-- Node: API routes -->
      <rect x="208" y="288" width="136" height="64" fill="#f2efe9" stroke="#131f39" stroke-width="3"/>

      <text x="276" y="344" class="sub" fill="#29374d" text-anchor="middle">rate limit · zod · SSE</text>

      <!-- Node: Reasons -->
      <rect x="400" y="96" width="168" height="64" fill="#f2efe9" stroke="#131f39" stroke-width="3"/>
      <rect x="408" y="104" width="60" height="12" fill="none" stroke="#131f39" stroke-width="1.5"/>
      <text x="438" y="113" class="tag" fill="#131f39" text-anchor="middle">SERVICE</text>
      <text x="484" y="138" class="name" fill="#131f39" text-anchor="middle">Reasons</text>
      <text x="484" y="152" class="sub" fill="#29374d" text-anchor="middle">streamed, one record at a time</text>

      <!-- Node: Taste agent -->
      <rect x="400" y="192" width="168" height="64" fill="#f2efe9" stroke="#131f39" stroke-width="3"/>
      <rect x="408" y="200" width="48" height="12" fill="none" stroke="#131f39" stroke-width="1.5"/>
      <text x="432" y="209" class="tag" fill="#131f39" text-anchor="middle">AGENT</text>
      <text x="484" y="234" class="name" fill="#131f39" text-anchor="middle">By vibe</text>
      <text x="484" y="248" class="sub" fill="#29374d" text-anchor="middle">Last.fm tools · ≤ 6 lookups</text>

      <!-- Node: Recommendations (focal) -->
      <rect x="400" y="288" width="168" height="64" fill="#1ec8bc" stroke="#131f39" stroke-width="3"/>
      <rect x="408" y="296" width="36" height="12" fill="none" stroke="#131f39" stroke-width="1.5"/>
      <text x="426" y="305" class="tag" fill="#131f39" text-anchor="middle">CORE</text>
      <text x="484" y="330" class="name" fill="#131f39" text-anchor="middle">Recommendations</text>
      <text x="484" y="344" class="sub" fill="#131f39" text-anchor="middle">RRF merge · pure functions</text>

      <!-- Node: Taste Check -->
      <rect x="400" y="384" width="168" height="64" fill="#f2efe9" stroke="#131f39" stroke-width="3"/>
      <rect x="408" y="392" width="36" height="12" fill="none" stroke="#131f39" stroke-width="1.5"/>
      <text x="426" y="401" class="tag" fill="#131f39" text-anchor="middle">EVAL</text>
      <text x="484" y="426" class="name" fill="#131f39" text-anchor="middle">Taste Check</text>
      <text x="484" y="440" class="sub" fill="#29374d" text-anchor="middle">blind test · 1–5 ratings</text>

      <!-- Node: Postgres -->
      <rect x="624" y="288" width="136" height="64" fill="#533852" stroke="#131f39" stroke-width="3"/>
      <rect x="632" y="296" width="36" height="12" fill="none" stroke="#f2efe9" stroke-width="1.5"/>
      <text x="650" y="305" class="tag" fill="#f2efe9" text-anchor="middle">NEON</text>
      <text x="692" y="330" class="name" fill="#f2efe9" text-anchor="middle">Postgres</text>
      <text x="692" y="344" class="sub" fill="#f2efe9" text-anchor="middle">cache · 30-day TTL</text>

      <!-- Node: Claude Haiku, spanning the two services that use it -->
      <rect x="808" y="96" width="128" height="160" fill="#131f39" stroke="#131f39" stroke-width="3"/>
      <rect x="816" y="104" width="32" height="12" fill="none" stroke="#f2efe9" stroke-width="1.5"/>
      <text x="832" y="113" class="tag" fill="#f2efe9" text-anchor="middle">LLM</text>
      <text x="872" y="172" class="name" fill="#f2efe9" text-anchor="middle">Claude Haiku</text>
      <text x="872" y="186" class="sub" fill="#b7bccb" text-anchor="middle">reasons · agent turns</text>

      <!-- Node: Last.fm -->
      <rect x="808" y="280" width="128" height="64" fill="#131f39" stroke="#131f39" stroke-width="3"/>
      <rect x="816" y="288" width="32" height="12" fill="none" stroke="#f2efe9" stroke-width="1.5"/>
      <text x="832" y="297" class="tag" fill="#f2efe9" text-anchor="middle">API</text>
      <text x="872" y="322" class="name" fill="#f2efe9" text-anchor="middle">Last.fm</text>
      <text x="872" y="336" class="sub" fill="#b7bccb" text-anchor="middle">similar, tags, top tracks</text>

      <!-- Node: iTunes Search -->
      <rect x="808" y="376" width="128" height="64" fill="#131f39" stroke="#131f39" stroke-width="3"/>
      <rect x="816" y="384" width="32" height="12" fill="none" stroke="#f2efe9" stroke-width="1.5"/>
      <text x="832" y="393" class="tag" fill="#f2efe9" text-anchor="middle">API</text>
      <text x="872" y="418" class="name" fill="#f2efe9" text-anchor="middle">iTunes Search</text>
      <text x="872" y="432" class="sub" fill="#b7bccb" text-anchor="middle">previews, covers</text>

      <!-- Legend strip -->
      <line x1="32" y1="508" x2="928" y2="508" stroke="#131f39" stroke-width="1.5"/>
      <text x="32" y="528" class="eyebrow-svg" fill="#131f39">LEGEND</text>

      <rect x="32" y="542" width="14" height="10" fill="#1ec8bc" stroke="#131f39" stroke-width="1.5"/>
      <text x="52" y="551" class="legend" fill="#131f39">Core service</text>
      <rect x="148" y="542" width="14" height="10" fill="#f2efe9" stroke="#131f39" stroke-width="1.5"/>

      <rect x="248" y="542" width="14" height="10" fill="#533852" stroke="#131f39" stroke-width="1.5"/>

      <line x1="736" y1="547" x2="764" y2="547" stroke="#131f39" stroke-width="2" stroke-dasharray="8,5" marker-end="url(#architecture-arrow)"/>
      <text x="772" y="551" class="legend" fill="#131f39">Optional (API key, daily cap)</text>
